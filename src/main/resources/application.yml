spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080

# 프론트 주소 (CORS). 배포 후 실제 주소로 바꿔서 환경변수로 넣기
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

---
# 로컬: H2 메모리 DB. DB 설치 없이 바로 실행됨
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:notebook;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

---
# 배포: 값은 전부 환경변수로 주입. 여기에 비밀번호 적지 않기
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
